services:
  backend:
    image: ecommerce-backend
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    depends_on:
      - shop.database

    environment:
      ConnectionStrings__DefaultConnection: "Host=shop.database;Port=5432;Database=shop_db;Username=admin;Password=shop1234"

      Jwt__Key: "super-secret-key-for-ecommerce-api-2026"
      Jwt__Issuer: "EcommerceApi"
      Jwt__Audience: "EcommerceClient"

    working_dir: /app/src/App

    volumes:
      - ./backend:/app
      - /app/src/App/bin
      - /app/src/App/obj
      - ./backend/src/App/wwwroot/images:/app/src/App/wwwroot/images

  shop.database:
    image: postgres:18
    container_name: shop.database
    restart: unless-stopped

    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: shop1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7.4-alpine
    container_name: redis-cache
    restart: always

    environment:
      ConnectionStrings__Redis: "redis:6379,password=StrongSecurePassword123"

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes --requirepass StrongSecurePassword123

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "StrongSecurePassword123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: